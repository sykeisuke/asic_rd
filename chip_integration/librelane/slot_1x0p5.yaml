# The wafer.space 1x0p5 slot: wafer-space/gf180mcu-project-template
# librelane/slots/slot_1x0p5.yaml at 0de7e394337a1f7f5303ac7a3681bf2481b58176,
# die, core and pad ORDER unchanged (so every bond pad sits where the
# template puts it). Only instance names differ where chip_top.sv
# re-types a position:
#   bidir[45] -> avdd_pad (gf180mcu_ocd_io__vdd, AVDD)
#   bidir[44] -> avss_pad (gf180mcu_ocd_io__vss)
#   analog[3] -> analog3_pad (asig_5p0, VIN); analog[2:0] stay (bi_a)
# The frozen specification slot is 0p5x1; 1x0p5 is the user's choice
# for this build (README, specification s.13 deviation).

