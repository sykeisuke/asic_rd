name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly digital build: unit tests, synthesis, STA and the RTL-to-GDS
    # flow of the digital top, 12:00 UTC (02:00 HST).
    - cron: "0 12 * * *"
    # Weekly full analog regression, Monday 06:00 UTC (Sunday 20:00 HST).
    - cron: "0 6 * * 1"
  # Manual runs: choose the weekly analog regression or the nightly builds.
  workflow_dispatch:
    inputs:
      run:
        description: Which scheduled jobs to run now
        type: choice
        options: [analog-regression, nightly]
        default: analog-regression

# The run scripts execute inside the pinned IIC-OSIC-TOOLS container
# (scripts/eda-common.sh pins the image by tag and digest), so CI reproduces
# the same environment as a developer machine. The image is large; the free
# disk space step below keeps the runner from filling up.

jobs:
  rtl:
    name: RTL simulation, synthesis, and co-simulation
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      # The run scripts bind-mount the checkout into the container, whose
      # user id differs from the runner's. Open up existing files, and run
      # the make steps with umask 000 so host-created work/ directories are
      # writable by the container user too.
      - name: Make workspace writable by the container user
        run: chmod -R a+rwX .

      - name: Verify pinned EDA environment
        run: make check

      - name: Cache frozen PDK libraries (3.3 V cells, pads)
        uses: actions/cache@v4
        with:
          path: .eda-tools/pdk
          key: gf180mcu-pdk-f6eeac7d-3v3-v1

      - name: Fetch frozen PDK libraries not in the image
        run: umask 000 && make pdk

      # actions/cache restores .eda-tools/ with the runner's default mode;
      # the container user must still be able to add the Python add-ons.
      - name: Make the tools directory writable by the container user
        run: sudo chmod -R a+rwX .eda-tools

      - name: Install pinned Python EDA add-ons
        run: umask 000 && make tools

      - name: Digital unit tests and GF180 mapping
        run: umask 000 && make counter gray-counter controller parallel-controller digital-top

      - name: Mixed-signal co-simulation and phase sweep
        run: umask 000 && make cosim four-cell-cosim phase-sweep

  nightly-digital:
    name: Nightly digital build (unit tests + RTL-to-GDS)
    if: (github.event_name == 'schedule' && github.event.schedule == '0 12 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Make workspace writable by the container user
        run: chmod -R a+rwX .

      - name: Verify pinned EDA environment
        run: make check

      - name: Cache frozen PDK libraries (3.3 V cells, pads)
        uses: actions/cache@v4
        with:
          path: .eda-tools/pdk
          key: gf180mcu-pdk-f6eeac7d-3v3-v1

      - name: Fetch frozen PDK libraries not in the image
        run: umask 000 && make pdk

      - name: Make the tools directory writable by the container user
        run: sudo chmod -R a+rwX .eda-tools

      - name: Digital unit tests, GF180 mapping, STA
        run: umask 000 && make counter gray-counter controller parallel-controller digital-top

      - name: Digital top RTL-to-GDS (LibreLane, 3.3 V)
        run: umask 000 && make digital-physical

      - name: Upload the nightly GDS and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asic_digital_top-nightly-${{ github.run_id }}
          path: |
            digital/asic_digital_top/physical/runs/gf180_rtl2gds/final/gds/asic_digital_top.gds
            digital/asic_digital_top/physical/runs/gf180_rtl2gds/final/lef/asic_digital_top.lef
            digital/asic_digital_top/physical/runs/gf180_rtl2gds/final/metrics.csv
            digital/asic_digital_top/physical/runs/gf180_rtl2gds/final/metrics.json
          retention-days: 14

  # The full chip from a clean checkout: the analog cells regenerated from
  # their generators (cicpy CMP/INV, gdsfactory INV_GF), wrapped as hard
  # macros, and placed with the digital top in the template pad ring.
  nightly-chip:
    name: Nightly full chip (analog cells + digital-on-top, LibreLane Chip flow)
    if: (github.event_name == 'schedule' && github.event.schedule == '0 12 * * *') || (github.event_name == 'workflow_dispatch' && inputs.run == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Make workspace writable by the container user
        run: chmod -R a+rwX .

      - name: Verify pinned EDA environment
        run: make check

      - name: Install pinned Python EDA add-ons (gdsfactory plugin, cicpy)
        run: umask 000 && make tools

      - name: Analog cells from their generators
        run: umask 000 && make layout gf-inverter

      # scripts/sim.sh exits with the make target's status and records
      # runs/top-placement/<stamp>/metrics.json.
      - name: Full chip (macros, P&R, DRC, LVS, antenna, fill)
        run: umask 000 && ./scripts/sim.sh top-placement

      - name: Upload the nightly chip GDS and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chip_top-nightly-${{ github.run_id }}
          path: |
            runs/top-placement/
            mixed_signal/top_placement/librelane/runs/chip_top/final/gds/chip_top.gds
            mixed_signal/top_placement/librelane/runs/chip_top/final/metrics.csv
            mixed_signal/top_placement/librelane/runs/chip_top/final/metrics.json
          retention-days: 14

  analog-regression:
    name: Full analog regression (weekly / manual)
    if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.run == 'analog-regression')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      # The run scripts bind-mount the checkout into the container, whose
      # user id differs from the runner's. Open up existing files, and run
      # the make steps with umask 000 so host-created work/ directories are
      # writable by the container user too.
      - name: Make workspace writable by the container user
        run: chmod -R a+rwX .

      - name: Verify pinned EDA environment
        run: make check

      - name: Cache frozen PDK libraries (3.3 V cells, pads)
        uses: actions/cache@v4
        with:
          path: .eda-tools/pdk
          key: gf180mcu-pdk-f6eeac7d-3v3-v1

      - name: Fetch frozen PDK libraries not in the image
        run: umask 000 && make pdk

      # actions/cache restores .eda-tools/ with the runner's default mode;
      # the container user must still be able to add the Python add-ons.
      - name: Make the tools directory writable by the container user
        run: sudo chmod -R a+rwX .eda-tools

      - name: Analog regression
        run: umask 000 && make analog-regression

      - name: RTL and co-simulation regression
        run: umask 000 && make counter gray-counter controller parallel-controller digital-top cosim four-cell-cosim phase-sweep
