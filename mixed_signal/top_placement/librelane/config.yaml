# Digital-on-top chip: the template's Chip flow (pad ring, core, seal
# ring, fill), with the digital top as soft logic and the analog cells as
# hard macros. Adapted from wafer-space/gf180mcu-project-template
# librelane/config.yaml at 0de7e394337a1f7f5303ac7a3681bf2481b58176.
#
# Read together with slot_0p5x1.yaml (die, core, pad order) and
# macros.yaml (placed hard macros and their power connections).
meta:
  version: 3
  flow: Chip
  substituting_steps:
    # Render the layout after sealring insertion
    KLayout.Render: null
    +KLayout.SealRing: KLayout.Render

    # Magic is not the signoff tool here (CLAUDE.md): KLayout's
    # gf180mcu.drc owns the DRC verdict. Magic DRC on a full 0p5x1 die
    # costs hours and its count would not be reported anyway.
    Magic.DRC: null
    Checker.MagicDRC: null

    # IR drop is a report, not a gate, and needs a power model this chip
    # does not have yet.
    OpenROAD.IRDropReport: null

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv
# the digital top, unchanged (8-bit parallel architecture, spec 0.6)
- dir::../../../digital/parallel_wilkinson_controller/parallel_wilkinson_controller.v
- dir::../../../digital/asic_digital_top/serial_readout.v
- dir::../../../digital/asic_digital_top/asic_digital_top.v
VERILOG_INCLUDE_DIRS:
- dir::../src

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets. With gf180mcu_fd_io the core and I/O supplies are
# one domain (chip_top.sv shorts VDD to DVDD under PAD_gf180mcu_fd_io).
VDD_NETS:
- VDD
GND_NETS:
- VSS

# Output-only pads leave bi_24t Y unused; the ID macros have no pins
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__qrcode_id
- gf180mcu_ws_ip__shuttle_id
- gf180mcu_ws_ip__project_id
- gf180mcu_ws_ip__logo
- gf180mcu_ws_ip__marker

# Conversion clock: 20 MHz (specification 5.5)
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 50

# Overfix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true

# Allow a larger Y displacement
PL_MAX_DISPLACEMENT_Y: 200

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN
PDN_CFG: dir::pdn_cfg.tcl
PDN_ENABLE_PINS: False

# PDN - Straps. The analog macros are 90 um tall so that at this pitch
# one VDD and one VSS Metal5 strap always cross their Metal4 straps.
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_CORE_RING_CONNECT_TO_PAD_LAYERS: [Metal2]

ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
- "*_CDNS_*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "G_ring_*"

# Metal2 cannot reach minimum density; dummy metal is moved to active
# metal during the precheck (template note)
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# Image render settings
KLAYOUT_RENDER_RESOLUTION: 2048
KLAYOUT_RENDER_OVERSAMPLING: 3
KLAYOUT_PROPERTIES: dir::../work/template/librelane/gf180mcu_render.lyp

# DRC settings. Eight workers, not "max": a full 0p5x1 die with fill
# on max workers exhausts the 15 GB this host has.
KLAYOUT_DRC_THREADS: 1

KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup" # disable CUP for now (template)
  variant: ref::$PDK
  workers: 8

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: 8

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: 8
