<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 406.637)" >.include /foss/pdks/gf180mcuD/libs.tech/ngspice/design.ngspice</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 416.361)" >.lib /foss/pdks/gf180mcuD/libs.tech/ngspice/sm141064.ngspice typical</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 426.084)" >.include /foss/pdk_libs/gf180mcuD/libs.ref/gf180mcu_as_sc_mcu7t3v3/spice/gf180mcu_as_sc_mcu7t3v3.spice</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 435.808)" >.param VDD=3.3</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 445.531)" >.param TCOUNT=50n</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 455.255)" >.param TCE=6.250000e-10</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 464.979)" >.param TDF=1.300000e-08</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 474.702)" >.param TSTOP=1100n</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 484.426)" >.temp 27</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 494.149)" >.csparam cs_vdd={VDD}</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 503.873)" >.options savecurrents reltol=1e-4</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 513.596)" >.tran 5p {TSTOP} 0 20p</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 523.32)" >.control</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 533.043)" >run</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 542.767)" >let half = $&amp;cs_vdd / 2</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 552.49)" >let hi90 = 0.9 * $&amp;cs_vdd</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 562.214)" >let lo10 = 0.1 * $&amp;cs_vdd</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 571.937)" >meas tran t_edge when v(clk)=$&amp;half fall=1 td=413e-9</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 581.661)" >meas tran t_q when v(q)=$&amp;half fall=1 td=100e-9</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 591.384)" >meas tran t_q90 when v(q)=$&amp;hi90 fall=1 td=100e-9</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 601.108)" >meas tran t_q10 when v(q)=$&amp;lo10 fall=1 td=100e-9</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 610.831)" >let tcq = t_q - t_edge</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 620.555)" >let q_fall = t_q10 - t_q90</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 630.278)" >set numdgt=10</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 640.002)" >echo RESULT_BEGIN</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 649.725)" >print tcq q_fall t_edge t_q</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 659.449)" >echo RESULT_END</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 669.172)" >quit</text>
<text fill="#222222"  xml:space="preserve" font-size="8.47735" style="font-family:Monospace;" transform="translate(35.6697, 678.896)" >.endc</text>
