<text fill="#222222"  xml:space="preserve" font-size="23.0796" transform="translate(16.65, 298.864)" >latch: the clocked latch after comparator, from the frozen library gf180mcu_as_sc_mcu7t3v3</text>
<text fill="#222222"  xml:space="preserve" font-size="13.8478" transform="translate(16.65, 334.865)" >q = d at the FALLING edge of clk (the 20 MHz count clock). One cell, dfxtn_2: static master-slave,</text>
<text fill="#222222"  xml:space="preserve" font-size="13.8478" transform="translate(16.65, 350.749)" >26 devices, 59.27 um2. No output buffer: its own stage drives 50 fF in 0.20 ns (0.27 ns at ss 85 C).</text>
<text fill="#222222"  xml:space="preserve" font-size="13.8478" transform="translate(16.65, 366.632)" >VNW = vdd, VPW = vss. The netlist needs the library: .include /foss/pdk_libs/gf180mcuD/libs.ref/</text>
<text fill="#222222"  xml:space="preserve" font-size="13.8478" transform="translate(16.65, 382.515)" >gf180mcu_as_sc_mcu7t3v3/spice/gf180mcu_as_sc_mcu7t3v3.spice (make pdk-libs).</text>
