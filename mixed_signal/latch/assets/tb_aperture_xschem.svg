<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 370.008)" >.include /foss/pdks/gf180mcuD/libs.tech/ngspice/design.ngspice</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 378.832)" >.lib /foss/pdks/gf180mcuD/libs.tech/ngspice/sm141064.ngspice typical</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 387.657)" >.include /foss/pdk_libs/gf180mcuD/libs.ref/gf180mcu_as_sc_mcu7t3v3/spice/gf180mcu_as_sc_mcu7t3v3.spice</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 396.481)" >.param VDD=3.3</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 405.306)" >.param TCOUNT=50n</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 414.131)" >.param TCE=6.250000e-10</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 422.955)" >.param TDF=1.300000e-08</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 431.78)" >.param TE=125n</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 440.605)" >.param DT=0.000000000000000e+00</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 449.429)" >.param TSTOP=240n</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 458.254)" >.temp 27</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 467.079)" >.csparam cs_vdd={VDD}</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 475.903)" >.csparam cs_te={TE}</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 484.728)" >.csparam cs_tcount={TCOUNT}</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 493.553)" >.options reltol=1e-5 abstol=1e-13 vntol=1e-7</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 502.377)" >.tran 1p {TSTOP} 0 5p</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 511.202)" >.control</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 520.026)" >run</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 528.851)" >let half = $&amp;cs_vdd / 2</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 537.676)" >let hi90 = 0.9 * $&amp;cs_vdd</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 546.5)" >let lo10 = 0.1 * $&amp;cs_vdd</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 555.325)" >meas tran t_q when v(q)=$&amp;half fall=1 td=100e-9</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 564.15)" >meas tran t_q2 when v(q)=$&amp;half fall=2 td=100e-9</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 572.974)" >meas tran t_qr when v(q)=$&amp;half rise=1 td=100e-9</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 581.799)" >meas tran t_q90 when v(q)=$&amp;hi90 fall=1 td=100e-9</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 590.624)" >meas tran t_q10 when v(q)=$&amp;lo10 fall=1 td=100e-9</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 599.448)" >let t_edge = $&amp;cs_te + floor((t_q - $&amp;cs_te) / $&amp;cs_tcount) * $&amp;cs_tcount</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 608.273)" >let edge_k = (t_edge - $&amp;cs_te) / $&amp;cs_tcount</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 617.098)" >let tcq = t_q - t_edge</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 625.922)" >let q_fall = t_q10 - t_q90</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 634.747)" >set numdgt=10</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 643.571)" >echo RESULT_BEGIN</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 652.396)" >print tcq q_fall edge_k t_q</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 661.221)" >echo RESULT_END</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 670.045)" >quit</text>
<text fill="#222222"  xml:space="preserve" font-size="7.69367" style="font-family:Monospace;" transform="translate(33.9114, 678.87)" >.endc</text>
